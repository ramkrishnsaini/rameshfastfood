# Build static site and deploy to GitHub Pages.
# Repo → Settings → Pages → Source: GitHub Actions.
# Set NEXT_PUBLIC_SITE_URL / NEXT_PUBLIC_BASE_PATH locally if you use a custom domain or non-default layout.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -e
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          if [ "$REPO_LC" = "${OWNER_LC}.github.io" ]; then
            export NEXT_PUBLIC_SITE_URL="https://${OWNER_LC}.github.io"
            export NEXT_PUBLIC_BASE_PATH=""
          else
            export NEXT_PUBLIC_SITE_URL="https://${OWNER_LC}.github.io/${REPO_LC}"
            export NEXT_PUBLIC_BASE_PATH="/${REPO_LC}"
          fi

          echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL"
          echo "NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-<empty>}"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
