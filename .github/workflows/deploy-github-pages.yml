# Build static site and deploy to GitHub Pages.
# Live site: https://rameshfastfood.in
# Repo → Settings → Pages → Custom domain: rameshfastfood.in (DNS + CNAME as per GitHub docs).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Canonical URL for sitemap, OG tags, JSON-LD (custom domain at site root — no base path).
          NEXT_PUBLIC_SITE_URL: https://rameshfastfood.in
        run: |
          echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
